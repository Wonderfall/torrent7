name: TorrentApp

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/torrent-app.yml"
      - "Documentation/EnhancedSecurityExtensionIntegration.md"
      - "Package.swift"
      - "Packaging/**"
      - "Scripts/build-app.zsh"
      - "Scripts/build-deps.zsh"
      - "Scripts/analyze-bridge.zsh"
      - "Scripts/boringssl-patch-series.sh"
      - "Scripts/verify-boringssl-hardening.zsh"
      - "Scripts/boost-patch-series.sh"
      - "Scripts/libtorrent-patch-series.sh"
      - "Scripts/lint-unsafe-boundaries.zsh"
      - "Scripts/native-deps-build-id.zsh"
      - "Scripts/run-tool.zsh"
      - "Scripts/test-tools.zsh"
      - "Scripts/patches/**"
      - "Scripts/release-app.zsh"
      - "Scripts/archive-release-evidence.zsh"
      - "Scripts/test-release-evidence.zsh"
      - "Scripts/test-ui.zsh"
      - "Scripts/test-enhanced-security-extension.zsh"
      - "Scripts/test-swift.zsh"
      - "Scripts/test-lifecycle.zsh"
      - "Scripts/verify-app.zsh"
      - "Scripts/verify-app-code.zsh"
      - "Scripts/package-executable.zsh"
      - "Scripts/test-executable-packaging.zsh"
      - "Scripts/verify-boost-asio-recycling-allocator.zsh"
      - "Scripts/verify-libtorrent-boringssl-tls.zsh"
      - "Scripts/verify-parser-reachability.zsh"
      - "Scripts/verify-xcode.zsh"
      - "Sources/**"
      - "Tests/**"
      - "Tools/**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/torrent-app.yml"
      - "Documentation/EnhancedSecurityExtensionIntegration.md"
      - "Package.swift"
      - "Packaging/**"
      - "Scripts/build-app.zsh"
      - "Scripts/build-deps.zsh"
      - "Scripts/analyze-bridge.zsh"
      - "Scripts/boringssl-patch-series.sh"
      - "Scripts/verify-boringssl-hardening.zsh"
      - "Scripts/boost-patch-series.sh"
      - "Scripts/libtorrent-patch-series.sh"
      - "Scripts/lint-unsafe-boundaries.zsh"
      - "Scripts/native-deps-build-id.zsh"
      - "Scripts/run-tool.zsh"
      - "Scripts/test-tools.zsh"
      - "Scripts/patches/**"
      - "Scripts/release-app.zsh"
      - "Scripts/archive-release-evidence.zsh"
      - "Scripts/test-release-evidence.zsh"
      - "Scripts/test-ui.zsh"
      - "Scripts/test-enhanced-security-extension.zsh"
      - "Scripts/test-swift.zsh"
      - "Scripts/test-lifecycle.zsh"
      - "Scripts/verify-app.zsh"
      - "Scripts/verify-app-code.zsh"
      - "Scripts/package-executable.zsh"
      - "Scripts/test-executable-packaging.zsh"
      - "Scripts/verify-boost-asio-recycling-allocator.zsh"
      - "Scripts/verify-libtorrent-boringssl-tls.zsh"
      - "Scripts/verify-parser-reachability.zsh"
      - "Scripts/verify-xcode.zsh"
      - "Sources/**"
      - "Tests/**"
      - "Tools/**"
  workflow_dispatch:

permissions: {}

env:
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  XCODE_CACHE_KEY: xcode-27.0-27A266a

concurrency:
  group: torrent-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Test, build, and verify
    runs-on: xcode-27
    permissions: {}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        shell: zsh {0}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            checkout_ref="refs/pull/${PR_NUMBER}/merge"
          else
            checkout_ref="$GITHUB_REF"
          fi

          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$checkout_ref"
          git checkout --detach FETCH_HEAD

      - name: Verify Xcode toolchain
        shell: zsh {0}
        run: Scripts/verify-xcode.zsh

      - name: Test unsafe boundary linter
        shell: zsh {0}
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift test \
            --package-path Tools/UnsafeBoundaryLint \
            --scratch-path .build/unsafe-boundary-lint \
            --only-use-versions-from-resolved-file

      - name: Install build tools
        shell: zsh {0}
        run: |
          set -euo pipefail
          brew install cmake ninja

      - name: Restore dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/deps/source-cache
            .build/deps/arm64e
          key: deps-arm64e-${{ env.XCODE_CACHE_KEY }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Scripts/build-deps.zsh', 'Scripts/boringssl-patch-series.sh', 'Scripts/boost-patch-series.sh', 'Scripts/libtorrent-patch-series.sh', 'Scripts/verify-boringssl-hardening.zsh', 'Scripts/verify-xcode.zsh', 'Scripts/patches/**') }}
      - name: Build pinned dependencies
        shell: zsh {0}
        run: |
          set -euo pipefail
          Scripts/build-deps.zsh

      - name: Check release policy tools
        shell: zsh {0}
        run: |
          set -euo pipefail
          for script in Scripts/build-app.zsh Scripts/release-app.zsh \
            Scripts/test-enhanced-security-extension.zsh Scripts/verify-app.zsh \
            Scripts/verify-app-code.zsh Scripts/package-executable.zsh Scripts/test-executable-packaging.zsh \
            Scripts/archive-release-evidence.zsh Scripts/test-release-evidence.zsh \
            Scripts/verify-parser-reachability.zsh Scripts/run-tool.zsh Scripts/test-tools.zsh; do
            zsh -n "$script"
          done
          Scripts/run-tool.zsh compare-entitlements \
            Packaging/Torrent7.entitlements \
            Packaging/Torrent7.entitlements
          unexpected_entitlements=$(mktemp)
          trap 'rm -f -- "$unexpected_entitlements"' EXIT
          cp Packaging/Torrent7.entitlements "$unexpected_entitlements"
          /usr/libexec/PlistBuddy -c "Add :unexpected bool true" "$unexpected_entitlements"
          if Scripts/run-tool.zsh compare-entitlements \
            Packaging/Torrent7.entitlements \
            "$unexpected_entitlements"; then
            print -ru2 -- "Entitlement allowlist accepted an unexpected key"
            exit 1
          fi

      - name: Run Swift tests
        shell: zsh {0}
        run: |
          set -euo pipefail
          Scripts/test-swift.zsh

      - name: Repeat concurrency lifecycle tests
        shell: zsh {0}
        run: Scripts/test-lifecycle.zsh --skip-build

      - name: Build app
        shell: zsh {0}
        run: |
          set -euo pipefail
          release_sbom_dir=$(mktemp -d "$PWD/.build/release-sboms.XXXXXXXX")
          print -r -- "RELEASE_SBOM_DIR=$release_sbom_dir" >> "$GITHUB_ENV"
          SKIP_BUILD_DEPS=1 SBOM_OUTPUT_DIR="$release_sbom_dir" Scripts/build-app.zsh

      - name: Verify executable packaging and rejection cases
        shell: zsh {0}
        run: |
          Scripts/test-executable-packaging.zsh \
            "$(xcrun swift build --configuration release --arch arm64e --show-bin-path)"

      - name: Verify release symbols and dependency inventories
        shell: zsh {0}
        run: |
          Scripts/test-release-evidence.zsh ".build/App/Torrent 7.app" \
            "$(xcrun swift build --configuration release --arch arm64e --show-bin-path)" \
            .build/deps/arm64e/prefix "$RELEASE_SBOM_DIR"

      - name: Compile UI and VoiceOver diagnostics
        shell: zsh {0}
        run: Scripts/test-ui.zsh --build-only

      - name: Verify app bundle
        shell: zsh {0}
        run: |
          set -euo pipefail
          Scripts/verify-app.zsh

      - name: Exercise the Enhanced Security extension lifecycle
        shell: zsh {0}
        run: |
          set -euo pipefail
          SKIP_BUILD_DEPS=1 Scripts/test-enhanced-security-extension.zsh --automated
